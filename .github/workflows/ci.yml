name: CI Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # La cabecera del plugin declara `Requires PHP: 8.0`, así que 8.0 se
      # prueba: una versión mínima declarada y nunca ejecutada es una promesa
      # sin verificar. 8.3 es el techo que el resto de la flota usa.
      matrix:
        php-version: ['8.0', '8.2', '8.3']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, json

      - name: Run Standalone Test Suite
        run: php tests/test-suite.php

      # `wp i18n make-pot` IS the definition of a fresh template in the step below, so wp-cli is a
      # hard requirement there rather than something it shrugs off. Into $HOME/bin, not the
      # workspace: an executable in the repo root would land in the copy the mutation runner makes.
      # No workflow input reaches these commands; the URL is a literal.
      - name: Install WP-CLI
        if: matrix.php-version == '8.3'
        run: |
          mkdir -p "$HOME/bin"
          curl -sSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o "$HOME/bin/wp"
          chmod +x "$HOME/bin/wp"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      # Verify languages/wm-ethical-conversion-triggers.pot stays synchronized with PHP source strings.
      - name: Translation template freshness
        if: matrix.php-version == '8.3'
        run: php tests/test-pot-freshness.php

      # Each correction listed in tests/mutations.php, undone on a copy, must turn the suite red.
      - name: Mutation Check
        run: bash tests/run-mutations.sh

      - name: Compliance & Security Audit
        run: python3 .github/scripts/security-audit.py

      - name: CRA / SBOM Validation
        run: |
          # El mandato SBOM del Cyber Resilience Act aplica desde el 2027-12-11.
          # Hasta que la flota tenga SBOMs esto avisa, no rompe el build.
          if [ ! -f "bom.json" ]; then
            echo "::warning::bom.json (SBOM) ausente — pendiente para el CRA (2027-12-11)."
          else
            echo "bom.json presente."
          fi
